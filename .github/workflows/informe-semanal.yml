name: Informe semanal
on:
  schedule:
    - cron: "0 7 * * 0"            # domingo, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: { group: estado, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Credenciales de YouTube
        run: mkdir -p secrets && printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/token.json
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      - run: scripts/estado.sh restaurar
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/informe-semanal"
          claude_args: "--permission-mode dontAsk --model sonnet --max-turns 60"
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKEN_FILE: secrets/token.json
      - if: always()
        run: scripts/estado.sh guardar
