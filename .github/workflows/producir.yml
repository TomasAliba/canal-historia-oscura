# Producción programada: pipeline en Python → sube como PRIVADO → veto (Environment) → programa publishAt.
# Claude se usa solo dentro del pipeline, vía `claude -p` con la suscripción (CLAUDE_CODE_OAUTH_TOKEN).
name: Producir vídeo
on:
  schedule:
    - cron: "0 6 * * 2"            # martes 06:00 UTC (1 vídeo/semana; se publica el viernes a las 19:00)
  workflow_dispatch:
    inputs:
      tema:
        description: "Slug del tema (opcional; por defecto, el siguiente del backlog o el vídeo a medias)"
        required: false
        default: ""
      simulado:
        description: "Ensayo sin TTS/IA reales ni subida"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Solo un escritor del estado a la vez. A nivel de job: la espera del veto no bloquea otros runs.
    concurrency: { group: estado, cancel-in-progress: false }
    outputs:
      slug: ${{ steps.resultado.outputs.slug }}
      estado: ${{ steps.resultado.outputs.estado }}
      modo_veto: ${{ steps.resultado.outputs.modo_veto }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Credenciales (ficheros efímeros del runner)
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/token.json
          printf '%s' "$GCP_TTS_SA_JSON" > secrets/gcp-tts.json
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GCP_TTS_SA_JSON: ${{ secrets.GCP_TTS_SA_JSON }}
      - name: Restaurar estado
        run: scripts/estado.sh restaurar
      - name: Pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: secrets/gcp-tts.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_TOKEN_FILE: secrets/token.json
          TEMA: ${{ github.event.inputs.tema }}
          SIMULADO: ${{ github.event.inputs.simulado }}
        run: |
          args=()
          if [ -n "$TEMA" ]; then args+=(--tema "$TEMA"); fi
          if [ "$SIMULADO" = "true" ]; then args+=(--simulado); fi
          python -m src.pipeline "${args[@]}"
      - name: Guardar estado
        if: always()
        run: scripts/estado.sh guardar
      - name: Leer resultado
        id: resultado
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, yaml
          r = pathlib.Path("data/estado/ultimo_resultado.json")
          datos = json.loads(r.read_text(encoding="utf-8")) if r.exists() else {}
          modo = yaml.safe_load(open("config/canal.yaml", encoding="utf-8"))["veto"]["modo"]
          print(f"slug={datos.get('slug', '')}")
          print(f"estado={datos.get('estado', 'SIN_RESULTADO')}")
          print(f"modo_veto={modo}")
          PY
      - name: Avisar por Telegram
        if: steps.resultado.outputs.estado == 'ESPERANDO_PUBLICACION'
        run: |
          python -m src.notificar --aprobacion "${{ steps.resultado.outputs.slug }}" \
            --modo "${{ steps.resultado.outputs.modo_veto }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  aprobar:
    # Solo espera la protección del Environment: sin pasos que toquen el estado ni concurrencia.
    # activo → "aprobacion" (required reviewers) · pasivo → "publicacion-diferida" (wait timer 24 h)
    needs: producir
    if: needs.producir.outputs.estado == 'ESPERANDO_PUBLICACION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ needs.producir.outputs.modo_veto == 'pasivo' && 'publicacion-diferida' || 'aprobacion' }}
    steps:
      - run: echo "Aprobado ${{ needs.producir.outputs.slug }}"

  publicar:
    needs: [producir, aprobar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: estado, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Credenciales
        run: mkdir -p secrets && printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/token.json
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      - run: scripts/estado.sh restaurar
      - name: Programar publicación (próximo día de publicación a la hora fijada)
        run: python -m src.publicar --programar "${{ needs.producir.outputs.slug }}"
        env:
          YOUTUBE_TOKEN_FILE: secrets/token.json
      - if: always()
        run: scripts/estado.sh guardar

  registrar-decision:
    # Aprobado (success), rechazado (failure) o vetado cancelando el run (cancelled).
    needs: [producir, aprobar, publicar]
    if: always() && needs.producir.outputs.estado == 'ESPERANDO_PUBLICACION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: estado, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - run: scripts/estado.sh restaurar
      - run: |
          python -m src.decisiones --registrar "${{ needs.producir.outputs.slug }}" \
            --resultado "${{ needs.aprobar.result }}"
      - run: scripts/estado.sh guardar
